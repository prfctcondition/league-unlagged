[package]
name = "league-unlagged"
version = "1.0.0"
edition = "2021"
description = "Universal Hardware-Adaptive FPS & Input Lag Optimizer for League of Legends (Zen Monochrome Edition)"
authors = ["prfctCondition"]
default-run = "league-unlagged"

[[bin]]
name = "league-unlagged"
path = "src/main.rs"

[[bin]]
name = "League-Unlagged-Windows-installer"
path = "src/bin/installer.rs"

[dependencies]
eframe = { version = "0.29", default-features = false, features = ["default_fonts", "wgpu"] }
egui = "0.29"
winreg = "0.52"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sysinfo = "0.32"
resvg = { version = "0.44", default-features = false }

[dependencies.windows-sys]
version = "0.59"
features = [
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_System_SystemInformation",
    "Win32_Security",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
]

[patch.crates-io]
egui-wgpu = { path = "vendor/egui-wgpu" }

